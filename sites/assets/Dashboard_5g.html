<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutomationPark Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       💎 PREMIUM ENTERPRISE MODERN UI (GEOAI MATCHED)
       ═══════════════════════════════════════════════════════════════════ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0d19;
      color: #94a3b8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .dashboard-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════════════
       🎨 SIDEBAR - INTEGRATED GEO PLATFORM STYLE
       ═══════════════════════════════════════════════════════════════════ */
    .sidebar {
      width: 300px;
      background-color: #06070d;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      align-self: flex-start;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sidebar-logo-img {
      display: block;
      width: 100%;
      max-width: 230px;
      height: auto;
      object-fit: contain;
    }

    .sidebar h2 {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
    }

    .sidebar label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar select,
    .sidebar input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      background-color: #111322;
      color: #f8fafc;
      font-size: 13px;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    .sidebar select:focus,
    .sidebar input[type="number"]:focus {
      outline: none;
      border-color: #0ea5e9;
    }

    .export-btn {
      width: 100%;
      padding: 12px;
      border: 1px solid #0ea5e9;
      border-radius: 6px;
      background: rgba(14, 165, 233, 0.1);
      color: #0ea5e9;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: auto;
    }

    .export-btn:hover {
      background: #0ea5e9;
      color: #ffffff;
    }

    /* Network Panels - Sleek List item Indicators */
    .network-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .network-btn {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: #111322;
      color: #94a3b8;
      font-weight: 500;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .network-btn:hover {
      background: rgba(255, 255, 255, 0.03);
      color: #f8fafc;
    }

    .network-all { border-left: 3px solid #64748b; }
    .network-5g { border-left: 3px solid #a855f7; }
    .network-4g { border-left: 3px solid #22c55e; }
    .network-3g { border-left: 3px solid #eab308; }

    /* ═══════════════════════════════════════════════════════════════════
       📊 MAIN CONTENT SPACE
       ═══════════════════════════════════════════════════════════════════ */
    .main-content {
      flex: 1;
      padding: 40px;
      max-width: 1800px;
      margin: 0 auto;
      width: calc(100% - 300px);
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dashboard-title {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timeline-panel {
      display: flex;
      gap: 8px;
    }

    .timeline-chip {
      padding: 6px 12px;
      border-radius: 4px;
      background: #111322;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* Professional Minimal Control Bar */
    .top-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      background: #111322;
      padding: 16px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .top-controls input[type="file"] {
      color: #64748b;
      font-size: 13px;
    }
    .top-controls input[type="file"]::-webkit-file-upload-button {
      background: #0ea5e9;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 12px;
    }

    .top-controls input[type="number"] {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      background: #06070d;
      color: #f8fafc;
      font-size: 13px;
      width: 120px;
    }

    /* ═══════════════════════════════════════════════════════════════════
       🎯 DYNAMIC GRID FILTER SYSTEM
       ═══════════════════════════════════════════════════════════════════ */
    #filters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    #filters > div {
      display: flex;
      flex-direction: column;
    }

    #filters label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    #filters select {
      width: 100%;
      height: 40px; /* Condensed multi-select look */
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      background: #111322;
      color: #e2e8f0;
      padding: 8px;
      font-size: 12px;
    }

    /* ═══════════════════════════════════════════════════════════════════
       💎 HIGH-LEVEL ENTERPRISE KPI CARDS
       ═══════════════════════════════════════════════════════════════════ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: #111322;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 24px;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .kpi-card:hover {
      border-color: rgba(14, 165, 233, 0.3);
      transform: translateY(-2px);
    }

    .kpi-card h3 {
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .kpi-card p {
      font-size: 32px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1;
      margin-bottom: 8px;
    }

    .kpi-card-subtext {
      font-size: 11px;
      color: #475569;
    }

    /* ═══════════════════════════════════════════════════════════════════
       📈 CHART MATTE PANELS
       ═══════════════════════════════════════════════════════════════════ */
    #chartsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .chart-card {
      background: #111322;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 24px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .kpi-main {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }

    .kpi-secondary {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .chart-selector {
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      background: #06070d;
      color: #f8fafc;
      font-size: 12px;
    }

    .chart-card canvas {
      width: 100% !important;
      height: 300px !important;
    }

    /* ═══════════════════════════════════════════════════════════════════
       🧠 INDUSTRIAL RCA SECTION
       ═══════════════════════════════════════════════════════════════════ */
    #rac-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .rac-card {
      background: #06070d;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 20px;
      font-size: 13px;
    }

    .rac-card strong {
      color: #f8fafc;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
    }

    .rac-card b {
      color: #64748b;
    }

    /* RESPONSIVE LAYOUT BREAKPOINTS */
    @media (max-width: 1200px) {
      .dashboard-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .main-content { width: 100%; padding: 20px; }
    }
  
    /* Codex function patch: keeps each dashboard theme, only styles newly moved sidebar controls. */
    .sidebar input[type="file"],
    .sidebar input[type="date"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.55);
      color: inherit;
      font: inherit;
    }
  

    /* V1.3 QA LayoutFix: persistent two-sidebar dashboard layout */
    .main-content{position:relative;max-width:none;margin:0;width:calc(100% - 300px);padding:24px 326px 40px 28px;}
    .dashboard-header{margin-bottom:18px;padding-bottom:16px;}
    .dashboard-title{font-size:24px;}
    .right-scope-sidebar{position:fixed;right:16px;top:16px;bottom:16px;width:290px;z-index:40;overflow-y:auto;padding:18px;border:1px solid rgba(14,165,233,.25);border-radius:10px;background:#06070df2;box-shadow:0 18px 50px rgba(0,0,0,.38);}
    .right-scope-sidebar h2{font-size:11px;color:#7dd3fc;text-transform:uppercase;letter-spacing:1.2px;margin:0 0 12px;}
    .right-scope-sidebar .section-gap{height:14px;border-top:1px solid rgba(255,255,255,.06);margin-top:14px;padding-top:14px;}
    #filters{display:block;margin:0;}
    #filters>div{margin-bottom:10px;}
    #filters label{margin-bottom:4px;color:#8fa5b9;}
    #filters select{height:36px;font-size:11px;padding:6px 8px;}
    .right-scope-sidebar .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;}
    .right-scope-sidebar .kpi-card{min-width:0;padding:10px;border-radius:6px;}
    .right-scope-sidebar .kpi-card h3{font-size:8px;line-height:1.25;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .right-scope-sidebar .kpi-card p{font-size:16px;margin-bottom:3px;}
    .right-scope-sidebar .kpi-card-subtext{font-size:8px;}
    #chartsContainer{grid-template-columns:repeat(2,minmax(360px,1fr));gap:18px;margin-top:0;}
    .chart-card{padding:18px;}
    .chart-card canvas{height:270px!important;}
    @media(max-width:1350px){.main-content{padding-right:28px}.right-scope-sidebar{position:relative;right:auto;top:auto;bottom:auto;width:100%;margin-bottom:18px}.right-scope-sidebar .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}#chartsContainer{grid-template-columns:1fr}.sidebar{position:relative;height:auto}}


    .network-panel a.network-btn{text-decoration:none;}


    /* V1.3 layout polish: balanced KPI-1/KPI-2 headers and more chart room */
    .right-scope-sidebar{width:272px;padding:16px;}
    .main-content{padding-right:304px;}
    #chartsContainer{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    .chart-card{min-width:0;padding:16px;overflow:hidden;}
    .chart-header{
      display:grid!important;
      grid-template-columns:minmax(0,1fr)!important;
      gap:9px!important;
      align-items:start!important;
      margin-bottom:12px!important;
      min-height:74px;
    }
    .chart-header > div:first-child{min-width:0;width:100%;}
    .chart-header > div:last-child{
      display:grid!important;
      grid-template-columns:minmax(0,1fr) 92px!important;
      gap:8px!important;
      align-items:center!important;
      width:100%!important;
      min-width:0!important;
    }
    .kpi-main{
      display:block;
      width:100%;
      min-width:0;
      font-size:12px!important;
      line-height:1.25!important;
      font-weight:700!important;
      white-space:nowrap!important;
      overflow:hidden!important;
      text-overflow:ellipsis!important;
      letter-spacing:0!important;
    }
    .chart-selector{
      width:100%!important;
      min-width:0!important;
      height:34px!important;
      padding:5px 8px!important;
      font-size:11px!important;
    }
    .chart-card canvas{height:286px!important;}
    @media(max-width:1500px){
      .right-scope-sidebar{width:258px;}
      .main-content{padding-right:288px;}
      .chart-card{padding:14px;}
      .kpi-main{font-size:11.5px!important;}
    }
    @media(max-width:1350px){
      .main-content{padding-right:28px;}
      .right-scope-sidebar{width:100%;}
      #chartsContainer{grid-template-columns:1fr;}
      .chart-header{min-height:0;}
    }

/* V1.4 KPI strip + auto-report status */
.main-content{padding-right:304px;}
.dashboard-header{margin-bottom:14px;}
.kpi-strip{margin:0 0 16px 0;}
.kpi-strip .kpi-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:0;}
.kpi-strip .kpi-card{min-width:0;padding:11px 10px;border-radius:7px;background:linear-gradient(180deg,#12172a,#0c1020);border:1px solid rgba(125,211,252,.13);box-shadow:none;}
.kpi-strip .kpi-card:nth-child(2n){border-color:rgba(16,185,129,.18)}
.kpi-strip .kpi-card:nth-child(3n){border-color:rgba(245,158,11,.20)}
.kpi-strip .kpi-card:nth-child(4n){border-color:rgba(168,85,247,.20)}
.kpi-strip .kpi-card h3{font-size:8px;line-height:1.2;min-height:20px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9fb4c6;}
.kpi-strip .kpi-card p{font-size:19px;line-height:1;margin:0 0 4px;color:#7dd3fc;}
.kpi-strip .kpi-card-subtext{font-size:7px;color:#52677b;}
.auto-feed-status{margin:6px 0 14px;padding:9px 10px;border:1px solid rgba(34,211,238,.18);border-radius:7px;background:rgba(34,211,238,.05);font-size:9px;line-height:1.35;color:#7dd3fc;}
.auto-feed-status b{display:block;color:#e2f6fb;font-size:9px;margin-bottom:2px;}
.right-scope-sidebar .kpi-grid{display:none!important;}
@media(max-width:1500px){.kpi-strip .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:900px){.kpi-strip .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.main-content{padding-right:20px;}}

/* V1.5 final dashboard polish */
.dashboard-header{border-bottom:2px solid #ffcc00!important;padding-bottom:14px!important;}
.dashboard-title{color:#ffcc00!important;text-shadow:0 0 18px rgba(255,204,0,.10);}
.right-network-layers{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,204,0,.20);}
.right-network-layers .sidebar-section{gap:0;}
.right-network-layers .sidebar-section>h2{color:#ffcc00!important;margin-bottom:10px!important;}
.right-network-layers .network-panel{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.right-network-layers .network-btn{min-width:0;padding:8px 9px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Normal laptops/standard desktops: one chart across. Large/wide displays: two charts. */
#chartsContainer{grid-template-columns:minmax(0,1fr)!important;}
@media (min-width:1700px){#chartsContainer{grid-template-columns:repeat(2,minmax(0,1fr))!important;}}
@media (max-width:1350px){.right-network-layers .network-panel{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (max-width:900px){.right-network-layers .network-panel{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* V1.6 KPI pairing: yellow KPI summary cards + SR/Attempt combo defaults */
.kpi-strip .kpi-card{background:linear-gradient(180deg,#ffd93d,#ffc400)!important;border-color:#ffe879!important;box-shadow:0 8px 24px rgba(255,204,0,.10)!important;}
.kpi-strip .kpi-card h3{color:#332800!important;font-weight:900!important;}
.kpi-strip .kpi-card p{color:#111827!important;font-weight:900!important;}
.kpi-strip .kpi-card-subtext{color:#6b5600!important;font-weight:700!important;}
.chart-pair-note{font-size:9px;color:#94a3b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}


/* V1.5.1 scope reset / return control */
.scope-reset-btn{
  width:100%;
  height:38px;
  margin:2px 0 8px;
  border:1px solid rgba(255,204,0,.72);
  border-radius:7px;
  background:linear-gradient(180deg,rgba(255,204,0,.14),rgba(255,204,0,.06));
  color:#ffcc00;
  font-size:11px;
  font-weight:800;
  letter-spacing:.45px;
  cursor:pointer;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.scope-reset-btn:hover{background:rgba(255,204,0,.18);border-color:#ffcc00;transform:translateY(-1px);}
.scope-reset-btn:active{transform:translateY(0);}


/* FINAL DEMO FREEZE: V1.6 functional base + V1.7 sidebar balance only */
.sidebar{background:linear-gradient(180deg,#06070d 0%,#080a10 55%,#090b10 100%)!important;border-right-color:rgba(255,204,0,.10)!important;}
.sidebar h2{color:#d7b832!important;letter-spacing:1.35px!important;}
.sidebar label{color:#8f9aaa!important;font-size:10px!important;font-weight:750!important;letter-spacing:.65px!important;}
.sidebar select,.sidebar input[type="number"],.sidebar input[type="date"],.sidebar input[type="file"]{border-color:rgba(255,255,255,.11)!important;background:#0d1019!important;color:#e7edf4!important;}
.sidebar select:hover,.sidebar input:hover{border-color:rgba(255,204,0,.28)!important;}
.sidebar select:focus,.sidebar input:focus{outline:none!important;border-color:rgba(255,204,0,.65)!important;box-shadow:0 0 0 2px rgba(255,204,0,.06)!important;}
.export-btn{border-color:rgba(255,204,0,.62)!important;background:linear-gradient(180deg,rgba(255,204,0,.10),rgba(255,204,0,.04))!important;color:#ffda36!important;}
.export-btn:hover{background:#ffcc00!important;color:#111827!important;}
.right-scope-sidebar{display:flex!important;flex-direction:column!important;background:linear-gradient(180deg,#070912f7 0%,#080b12f7 56%,#0c0f15f7 100%)!important;border-color:rgba(255,204,0,.24)!important;}
.right-scope-sidebar>h2{color:#ffcc00!important;margin-bottom:12px!important;}
.right-scope-sidebar #filters{display:flex!important;flex-direction:column!important;gap:5px!important;}
.right-scope-sidebar #filters>div{margin-bottom:5px!important;}
.right-scope-sidebar #filters label{font-size:9px!important;letter-spacing:.65px!important;color:#aab4c0!important;}
.right-scope-sidebar #filters select{height:39px!important;border-color:rgba(255,255,255,.12)!important;background:#0d111b!important;color:#f3f6f9!important;}
.right-network-layers{margin-top:10px!important;padding-top:12px!important;border-top:1px solid rgba(255,204,0,.24)!important;}
.right-network-layers .network-panel{grid-template-columns:1fr!important;gap:7px!important;}
.right-network-layers .network-btn{min-height:35px!important;font-size:10.5px!important;background:#0e121b!important;border-top:1px solid rgba(255,255,255,.035)!important;border-right:1px solid rgba(255,255,255,.035)!important;border-bottom:1px solid rgba(255,255,255,.035)!important;}
.kpi-pair-controls{display:grid!important;grid-template-columns:minmax(0,1fr) 88px 34px!important;gap:6px!important;width:100%!important;align-items:center!important;}
.kpi-pair-controls + .kpi-pair-controls{margin-top:6px!important;}
.kpi-search-wrap{display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:5px;min-width:0;}
.kpi-search-input{width:100%;height:34px;border:1px solid rgba(255,255,255,.10);border-radius:4px;background:#06070d;color:#f8fafc;padding:5px 8px;font-size:10px;min-width:0;}
.kpi1-fixed{display:flex;align-items:center;min-height:34px;background:#111522!important;color:#ffd42a!important;border:1px solid rgba(255,204,0,.35)!important;font-weight:850;cursor:not-allowed;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  const themeColors = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#f97316","#14b8a6","#ec4899","#22c55e"];

  function byId(id){ return document.getElementById(id); }
  function firstSelector(selectors){
    for (const selector of selectors) {
      const el = document.querySelector(selector);
      if (el) return el;
    }
    return null;
  }
  function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }
  function numericKeys(data){
    if (!data || !data.length) return [];
    return Object.keys(data[0]).filter(key => data.some(row => typeof row[key] === "number" && Number.isFinite(row[key])));
  }
  function findTemporalKey(data){
    if (!data || !data.length) return null;
    const keys = Object.keys(data[0]);
    return keys.find(k => /date|time|day|month|week/i.test(k)) || null;
  }
  function parseDateValue(value){
    if (value === null || value === undefined || value === "") return null;
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
  }
  function aggregateValues(values, strategy){
    const valid = values.filter(v => typeof v === "number" && Number.isFinite(v));
    if (!valid.length) return 0;
    if (strategy === "sum") return valid.reduce((a,b) => a + b, 0);
    if (strategy === "max") return Math.max(...valid);
    if (strategy === "min") return Math.min(...valid);
    return valid.reduce((a,b) => a + b, 0) / valid.length;
  }
  function buildGranularityLabel(value, mode){
    const parsed = parseDateValue(value);
    if (!parsed) return String(value || "Unknown Date");
    const year = parsed.getFullYear();
    const month = String(parsed.getMonth() + 1).padStart(2, "0");
    const day = String(parsed.getDate()).padStart(2, "0");
    const normalized = String(mode || "Daily").toLowerCase();
    if (normalized.includes("month")) return `${year}-${month}`;
    if (normalized.includes("week")) {
      const weekStart = new Date(parsed);
      const offset = (weekStart.getDay() + 6) % 7;
      weekStart.setDate(weekStart.getDate() - offset);
      return `${weekStart.getFullYear()}-${String(weekStart.getMonth() + 1).padStart(2, "0")}-${String(weekStart.getDate()).padStart(2, "0")} Week`;
    }
    if (normalized.includes("year")) return `${year}`;
    if (normalized.includes("hour")) return `${year}-${month}-${day} ${String(parsed.getHours()).padStart(2, "0")}:00`;
    return `${year}-${month}-${day}`;
  }

  function wireEvents(){
    const scopeResetBtn = byId("scopeResetBtn");
    if (scopeResetBtn && !scopeResetBtn.dataset.wired) {
      scopeResetBtn.dataset.wired = "1";
      scopeResetBtn.addEventListener("click", resetNetworkScope);
    }
    if (byId("fileInput")) byId("fileInput").addEventListener("change", handleFile);
    ["limitInput","granularitySelect","groupKeySelect","groupStrategySelect","startDateInput","endDateInput"].forEach(id => {
      if (byId(id)) {
        const evt = id === "limitInput" ? "input" : "change";
        byId(id).addEventListener(evt, runEnginePipeline);
      }
    });

    const streamButtons = [
      ["all", byId("btn-all") || document.querySelector(".network-all") || document.querySelector("#tab-all")],
      ["5g", byId("btn-5g") || document.querySelector(".network-5g") || document.querySelector("#tab-5g")],
      ["4g", byId("btn-4g") || document.querySelector(".network-4g") || document.querySelector("#tab-4g")],
      ["3g", byId("btn-3g") || document.querySelector(".network-3g") || document.querySelector("#tab-3g")],
      ["worst", byId("btn-worst") || document.querySelector("#tab-worst") || Array.from(document.querySelectorAll(".network-btn,.stream-item")).find(btn => /worst|critical/i.test(btn.textContent))]
    ];

    streamButtons.forEach(([key, btn]) => {
      if (!btn || btn.tagName === 'A') return;
      btn.addEventListener("click", evt => {
        evt.preventDefault();
        document.querySelectorAll(".network-btn,.stream-item").forEach(b => b.classList.remove("active","active-stream"));
        btn.classList.add(btn.classList.contains("stream-item") ? "active-stream" : "active");
        currentStreamFilter = key;
        runEnginePipeline();
      });
    });
  }

  function handleFile(event){
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    Papa.parse(file, {
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: results => {
        globalData = (results.data || []).filter(row => Object.keys(row).length > 0 && Object.values(row).some(v => v !== null && v !== ""));
        if (!globalData.length) {
          alert("No valid data found in CSV.");
          return;
        }
        populateGroupingDropdowns(globalData);
        buildDynamicFilters(globalData);
        updateBadges(globalData);
        runEnginePipeline();
      },
      error: err => alert("CSV parsing error: " + err.message)
    });
  }

  function populateGroupingDropdowns(data){
    const groupSelect = byId("groupKeySelect");
    if (!groupSelect || !data.length) return;
    groupSelect.innerHTML = `<option value="__NONE__">No Grouping (Raw Rows)</option>`;
    const sample = data[0];
    Object.keys(sample).forEach(key => {
      const values = [...new Set(data.map(row => row[key]).filter(v => v !== null && v !== ""))];
      if (values.length > 1 && values.length <= 80 && typeof sample[key] !== "number") {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;
        groupSelect.appendChild(opt);
      }
    });
  }

  function buildDynamicFilters(data){
    const filterDiv = byId("filters");
    if (!filterDiv || !data.length) return;
    const ordered = ["Network","Region","City","Vendor","Cluster","TAC_LAC","Site","Cell"];
    const previous = {};
    filterDiv.querySelectorAll("select[data-key]").forEach(s => previous[s.dataset.key] = s.value);
    filterDiv.innerHTML = "";
    let scoped = [...data];
    ordered.forEach(key => {
      if (!(key in data[0])) return;
      const values = [...new Set(scoped.map(row => row[key]).filter(v => v !== null && v !== ""))].map(String).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      if (!values.length) return;
      const wrapper = document.createElement("div");
      const label = document.createElement("label");
      label.textContent = key === "TAC_LAC" ? "TAC / LAC" : key;
      const select = document.createElement("select");
      select.dataset.key = key;
      select.innerHTML = `<option value="__ALL__">ALL ${escapeHTML(label.textContent).toUpperCase()}</option>`;
      values.forEach(value => { const opt=document.createElement("option"); opt.value=value; opt.textContent=value; select.appendChild(opt); });
      const wanted = previous[key];
      if (wanted && values.includes(wanted)) select.value = wanted;
      if (select.value !== "__ALL__") scoped = scoped.filter(row => String(row[key]) === select.value);
      select.addEventListener("change", () => { buildDynamicFilters(globalData); runEnginePipeline(); });
      wrapper.appendChild(label); wrapper.appendChild(select); filterDiv.appendChild(wrapper);
    });
  }

  function resetNetworkScope(){
    if (!globalData.length) return;
    document.querySelectorAll("#filters select[data-key]").forEach(select => { select.value = "__ALL__"; });
    buildDynamicFilters(globalData);
    document.querySelectorAll("#filters select[data-key]").forEach(select => { select.value = "__ALL__"; });
    runEnginePipeline();
  }

  function updateBadges(data){
    const countMatch = pattern => data.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(pattern))).length;
    if (byId("badge-all")) byId("badge-all").textContent = data.length;
    if (byId("badge-5g")) byId("badge-5g").textContent = countMatch("5g");
    if (byId("badge-4g")) byId("badge-4g").textContent = countMatch("4g") || countMatch("lte");
    if (byId("badge-3g")) byId("badge-3g").textContent = countMatch("3g") || countMatch("umts");
    if (byId("badge-worst")) byId("badge-worst").textContent = Math.max(1, Math.floor(data.length * 0.15));
  }

  function runEnginePipeline(){
    if (!globalData.length) return;
    let processed = [...globalData];

    if (currentStreamFilter === "5g") {
      processed = processed.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes("5g")));
    } else if (currentStreamFilter === "4g") {
      processed = processed.filter(row => Object.values(row).some(v => /4g|lte/i.test(String(v))));
    } else if (currentStreamFilter === "3g") {
      processed = processed.filter(row => Object.values(row).some(v => /3g|umts/i.test(String(v))));
    } else if (currentStreamFilter === "worst") {
      const metric = numericKeys(processed)[0];
      if (metric) processed = processed.sort((a,b) => (a[metric] || 0) - (b[metric] || 0)).slice(0, Math.max(5, Math.floor(processed.length * 0.2)));
    }

    document.querySelectorAll("#filters select").forEach(select => {
      if (!select.dataset.key || select.value === "__ALL__") return;
      processed = processed.filter(row => String(row[select.dataset.key]) === select.value);
    });

    const temporalKey = findTemporalKey(processed);
    const start = byId("startDateInput") && byId("startDateInput").value ? new Date(byId("startDateInput").value) : null;
    const end = byId("endDateInput") && byId("endDateInput").value ? new Date(byId("endDateInput").value + "T23:59:59") : null;
    if (temporalKey && (start || end)) {
      processed = processed.filter(row => {
        const d = parseDateValue(row[temporalKey]);
        if (!d) return false;
        if (start && d < start) return false;
        if (end && d > end) return false;
        return true;
      });
    }

    const groupedByDate = applyGranularity(processed);
    const groupKey = byId("groupKeySelect") ? byId("groupKeySelect").value : "__NONE__";
    let finalData = groupKey && groupKey !== "__NONE__" ? aggregateBy(groupedByDate, groupKey) : groupedByDate;
    const limit = byId("limitInput") ? parseInt(byId("limitInput").value, 10) : 50;
    if (!Number.isNaN(limit) && limit > 0) finalData = finalData.slice(-limit);
    renderDashboard(finalData, processed, groupKey);
  }

  function applyGranularity(data){
    if (!data.length) return data;
    const mode = byId("granularitySelect") ? byId("granularitySelect").value : "Daily";
    const temporalKey = findTemporalKey(data);
    if (!temporalKey) return data;
    const metrics = numericKeys(data);
    const strategy = byId("groupStrategySelect") ? byId("groupStrategySelect").value : "avg";
    const buckets = {};
    data.forEach(row => {
      const bucket = buildGranularityLabel(row[temporalKey], mode);
      if (!buckets[bucket]) buckets[bucket] = [];
      buckets[bucket].push(row);
    });
    return Object.keys(buckets).map(bucket => {
      const rows = buckets[bucket];
      const composite = { date_bucket: bucket };
      metrics.forEach(metric => composite[metric] = aggregateValues(rows.map(r => r[metric]), strategy));
      return composite;
    });
  }

  function aggregateBy(data, groupKey){
    if (!data.length) return data;
    const strategy = byId("groupStrategySelect") ? byId("groupStrategySelect").value : "avg";
    const metrics = numericKeys(data);
    const groups = {};
    data.forEach(row => {
      const label = String(row[groupKey] ?? "Unknown");
      if (!groups[label]) groups[label] = [];
      groups[label].push(row);
    });
    return Object.keys(groups).map(label => {
      const rows = groups[label];
      const composite = { [groupKey]: label };
      metrics.forEach(metric => composite[metric] = aggregateValues(rows.map(r => r[metric]), strategy));
      return composite;
    });
  }

  function normalizedTokens(name){
    return String(name||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(t=>t && !["e","utran","ran","view","total","avg","average","sr","success","rate","setup","stp"].includes(t));
  }

  function findAttemptMetric(srMetric, metrics){
    const explicit = {
      "E-UTRAN RRC conn stp SR": "RRC stp att tot",
      "E-UTRAN E-RAB stp SR": "E-UTRAN E-RAB Setup Attempts",
      "E-UTRAN Total HO SR, inter eNB S1": "E-UTRAN HP att, inter eNB S1",
      "inter eNB E-UTRAN HO SR X2": "Inter X2 based HO Att"
    };
    if(explicit[srMetric] && metrics.includes(explicit[srMetric])) return explicit[srMetric];
    const attempts=metrics.filter(m=>/\batt\b|attempt/i.test(m));
    if(!attempts.length)return "";
    const source=new Set(normalizedTokens(srMetric));
    let best="",score=0;
    attempts.forEach(candidate=>{
      const ct=normalizedTokens(candidate);
      let hit=0; ct.forEach(t=>{if(source.has(t))hit++});
      // Strong bonuses for the same KPI family.
      const a=srMetric.toLowerCase(), b=candidate.toLowerCase();
      if(/rrc/.test(a)&&/rrc/.test(b))hit+=3;
      if(/e.?rab/.test(a)&&/e.?rab/.test(b))hit+=3;
      if(/ho|handover/.test(a)&&/ho|handover/.test(b))hit+=2;
      if(/x2/.test(a)&&/x2/.test(b))hit+=4;
      if(/s1/.test(a)&&/s1/.test(b))hit+=4;
      if(/re.?estab/.test(a)&&/re.?estab/.test(b))hit+=5;
      if(/inter.?freq/.test(a)&&/inter.?freq/.test(b))hit+=4;
      if(/intra.?freq/.test(a)&&/intra.?freq/.test(b))hit+=4;
      if(hit>score){score=hit;best=candidate;}
    });
    return score>=4?best:"";
  }

  function preferredMetricOrder(metrics){
    const preferred=[
      "E-UTRAN RRC conn stp SR",
      "RRC Conn Re-estab SR",
      "E-UTRAN E-RAB stp SR",
      "E-UTRAN Total HO SR, inter eNB S1",
      "inter eNB E-UTRAN HO SR X2",
      "E-UTRAN Inter-Freq HO SR",
      "E-UTRAN Intra-Freq HO SR",
      "IntraLTE HO SR",
      "S1SignConnSetupSR",
      "Cell Avail"
    ].filter(m=>metrics.includes(m));
    const usedAttempts=new Set(preferred.map(m=>findAttemptMetric(m,metrics)).filter(Boolean));
    const rest=metrics.filter(m=>!preferred.includes(m)&&!usedAttempts.has(m));
    return preferred.concat(rest);
  }

  function renderDashboard(chartData, sourceData, groupKey){
    chartInstances.forEach(chart => chart.destroy());
    chartInstances = [];
    chartIndex = 0;
    const kpiContainer = firstSelector([".kpi-grid", "#kpi-container"]);
    const chartContainer = byId("chartsContainer");
    let racContainer = byId("rac-results");
    if (!racContainer && chartContainer) {
      racContainer = document.createElement("div");
      racContainer.id = "rac-results";
      chartContainer.after(racContainer);
    }
    if (kpiContainer) kpiContainer.innerHTML = "";
    if (chartContainer) chartContainer.innerHTML = "";
    if (!chartData.length) {
      if (chartContainer) chartContainer.innerHTML = `<div style="padding:20px;color:#ef4444;">No matching records for current filters.</div>`;
      if (racContainer) racContainer.innerHTML = "";
      return;
    }

    const metrics = numericKeys(chartData);
    const ordered = preferredMetricOrder(metrics);
    ordered.slice(0, 8).forEach(metric => {
      const values = chartData.map(row => row[metric]).filter(v => typeof v === "number" && Number.isFinite(v));
      if (!values.length) return;
      createKpi(kpiContainer, metric, aggregateValues(values, "avg"));
    });
    ordered.forEach(metric => {
      const values = chartData.map(row => row[metric]).filter(v => typeof v === "number" && Number.isFinite(v));
      if (!values.length) return;
      createChart(chartContainer, chartData, metric, metrics, groupKey, findAttemptMetric(metric, metrics));
    });
    showRac(racContainer, sourceData);
  }

  function createKpi(container, name, value){
    if (!container) return;
    const card = document.createElement("div");
    card.className = container.id === "kpi-container" ? "kpi-mini-card" : "kpi-card";
    card.innerHTML = `<h3>${escapeHTML(name)}</h3><p>${Number(value).toFixed(2)}</p><div class="kpi-card-subtext">Filtered KPI Average</div>`;
    container.appendChild(card);
  }

  function chartLabels(data, groupKey){
    return data.map((row, index) => {
      if (groupKey && groupKey !== "__NONE__" && row[groupKey] !== undefined) return String(row[groupKey]);
      const key = Object.keys(row).find(k => /date|time|bucket/i.test(k)) || Object.keys(row).find(k => typeof row[k] === "string") || Object.keys(row)[0];
      return row[key] ?? `Row ${index + 1}`;
    });
  }

  function scaleStats(values){
    const valid = values.filter(v => typeof v === "number" && Number.isFinite(v));
    if (!valid.length) return { min: 0, max: 0, range: 0, absMax: 0 };
    const min = Math.min(...valid);
    const max = Math.max(...valid);
    return { min, max, range: Math.max(max - min, 1e-9), absMax: Math.max(Math.abs(min), Math.abs(max), 1e-9) };
  }

  function needsSecondAxis(primaryValues, overlayValues){
    const a = scaleStats(primaryValues);
    const b = scaleStats(overlayValues);
    if (a.absMax === 0 || b.absMax === 0) return false;
    const magnitudeRatio = Math.max(a.absMax, b.absMax) / Math.max(Math.min(a.absMax, b.absMax), 1e-9);
    const rangeRatio = Math.max(a.range, b.range) / Math.max(Math.min(a.range, b.range), 1e-9);
    return magnitudeRatio >= 6 || rangeRatio >= 12;
  }

  function createChart(container, data, metric, metrics, groupKey, preferredOverlay=""){
    if (!container) return;
    const card = document.createElement("div");
    card.className = "chart-card";
    const header = document.createElement("div");
    header.className = "chart-header";
    const pairText=preferredOverlay?`Default pair: SR line + ${escapeHTML(preferredOverlay)} bar`:`No matching Attempt counter in current feed`;
    const metricOptions = metrics.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');
    const kpi2Options = metrics.filter(m=>m!==metric).map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');
    header.innerHTML = `
      <div><div class="kpi-main">${escapeHTML(metric)}</div><div class="chart-pair-note">${pairText}</div></div>
      <div>
        <div class="kpi-pair-controls">
          <div class="chart-selector kpi1-fixed" title="KPI 1 is fixed for this chart">🔒 KPI 1 · ${escapeHTML(metric)}</div>
          <select class="chart-selector kpi-type-select primary-type-select" title="KPI 1 chart type"><option value="line">KPI 1 · Line</option><option value="bar">KPI 1 · Bar</option><option value="area">KPI 1 · Area</option><option value="stepped">KPI 1 · Stepped</option><option value="stackedBar">KPI 1 · Stacked Bar</option><option value="pie">KPI 1 · Pie</option><option value="doughnut">KPI 1 · Doughnut</option><option value="radar">KPI 1 · Radar</option><option value="polarArea">KPI 1 · Polar Area</option></select>
          <span></span>
        </div>
        <div class="kpi-pair-controls kpi2-row">
          <select class="chart-selector kpi-metric-select overlay-metric-select" title="Select KPI 2 — all report KPIs except fixed KPI 1"><option value="">-- Select KPI 2 from report --</option>${kpi2Options}</select>
          <select class="chart-selector kpi-type-select overlay-type-select" title="KPI 2 chart type"><option value="bar">KPI 2 · Bar</option><option value="line">KPI 2 · Line</option><option value="area">KPI 2 · Area</option><option value="stepped">KPI 2 · Stepped</option><option value="stackedBar">KPI 2 · Stacked Bar</option><option value="pie">KPI 2 · Pie</option><option value="doughnut">KPI 2 · Doughnut</option><option value="radar">KPI 2 · Radar</option><option value="polarArea">KPI 2 · Polar Area</option></select>
          <button class="kpi2-close" type="button" title="Hide KPI 2">×</button>
        </div>
        <button class="kpi2-add" type="button" title="Restore KPI 2 selector">＋ Add KPI 2</button>
      </div>`;
    const canvas = document.createElement("canvas");
    card.appendChild(header); card.appendChild(canvas); container.appendChild(card);

    const overlayMetricSelect=card.querySelector('.overlay-metric-select');
    const primaryTypeSelect=card.querySelector('.primary-type-select'), overlayTypeSelect=card.querySelector('.overlay-type-select');
    const primaryTitle=card.querySelector('.kpi-main'), pairNote=card.querySelector('.chart-pair-note');
    const kpi2Row=card.querySelector('.kpi2-row'), kpi2Close=card.querySelector('.kpi2-close'), kpi2Add=card.querySelector('.kpi2-add');
    let primaryMetric=metric, overlayMetric=(preferredOverlay&&preferredOverlay!==metric&&metrics.includes(preferredOverlay))?preferredOverlay:'';
    overlayMetricSelect.value=overlayMetric;
    primaryTypeSelect.value='line'; overlayTypeSelect.value='bar';
    let instance=null;
    const render=()=>{
      if(instance)instance.destroy();
      const primary="#a855f7", secondary="#7c3aed";
      const primaryValues=data.map(row=>row[primaryMetric]);
      const overlayValues=overlayMetric?data.map(row=>row[overlayMetric]):[];
      const dualAxis=overlayMetric&&needsSecondAxis(primaryValues,overlayValues);
      const labels=chartLabels(data,groupKey);
      const primaryMode=primaryTypeSelect.value||'line', overlayMode=overlayTypeSelect.value||'bar';
      const radialModes=['pie','doughnut','radar','polarArea'];
      const radialPrimary=radialModes.includes(primaryMode), radialOverlay=overlayMetric&&radialModes.includes(overlayMode);
      const axisScales={x:{grid:{color:"rgba(148,163,184,0.12)"}},y:{position:"left",grid:{color:"rgba(148,163,184,0.12)"},ticks:{color:primary}},...(dualAxis?{y1:{position:"right",grid:{drawOnChartArea:false},ticks:{color:secondary}}}:{})};
      const palette=labels.map((_,i)=>`hsla(${(42+i*19)%360},85%,55%,.72)`);
      const cartesianDataset=(label,values,mode,color,bg,axis,order)=>{
        const type=(mode==='bar'||mode==='stackedBar')?'bar':'line';
        return {label,data:values,type,borderColor:color,backgroundColor:(mode==='area'?bg:(type==='bar'?bg:'rgba(0,0,0,0)')),borderWidth:type==='line'?2.7:1.5,pointRadius:type==='line'?2:0,tension:mode==='stepped'?0:.30,stepped:mode==='stepped',fill:mode==='area',yAxisID:axis,order,stack:mode==='stackedBar'?'kpiStack':undefined};
      };
      let datasets, chartType='bar', chartOptions;
      if(radialPrimary||radialOverlay){
        const usePrimary=radialPrimary||!radialOverlay;
        const radialMode=usePrimary?primaryMode:overlayMode;
        const radialMetric=usePrimary?primaryMetric:overlayMetric;
        const radialValues=usePrimary?primaryValues:overlayValues;
        datasets=[{label:radialMetric,data:radialValues,borderColor:'#a855f7',backgroundColor:palette,borderWidth:1.2,pointRadius:radialMode==='radar'?2:0,fill:radialMode==='radar'}];
        chartType=radialMode;
        chartOptions={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{usePointStyle:true}}}};
      }else{
        datasets=[cartesianDataset(primaryMetric,primaryValues,primaryMode,primary,"rgba(255,204,0,.28)",'y',1)];
        if(overlayMetric)datasets.push(cartesianDataset(overlayMetric,overlayValues,overlayMode,secondary,"rgba(245,158,11,.28)",dualAxis?'y1':'y',2));
        const stacked=primaryMode==='stackedBar'||overlayMode==='stackedBar';
        if(stacked){axisScales.x.stacked=true;axisScales.y.stacked=true;if(axisScales.y1)axisScales.y1.stacked=true;}
        chartOptions={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{usePointStyle:true}}},scales:axisScales};
      }
      instance=new Chart(canvas,{type:chartType,data:{labels,datasets},options:chartOptions});
      chartInstances.push(instance);
      primaryTitle.textContent=primaryMetric;
      pairNote.textContent=(radialPrimary||radialOverlay)?`Radial view: ${(radialPrimary?primaryMetric:overlayMetric)} · ${(radialPrimary?primaryMode:overlayMode)}`:(overlayMetric?`Selected pair: ${primaryMetric} ${primaryTypeSelect.value} + ${overlayMetric} ${overlayTypeSelect.value}`:'KPI 2 hidden — click “Add KPI 2” to restore');
    };
    overlayMetricSelect.addEventListener('change',()=>{ const chosen=overlayMetricSelect.value||''; overlayMetric=(chosen===primaryMetric)?(metrics.find(m=>m!==primaryMetric)||''):chosen; overlayMetricSelect.value=overlayMetric; render();});
    primaryTypeSelect.addEventListener('change',render); overlayTypeSelect.addEventListener('change',render);
    kpi2Close.addEventListener('click',()=>{
      overlayMetric=''; overlayMetricSelect.value='';
      kpi2Row.classList.add('is-hidden'); kpi2Add.classList.add('is-visible');
      render();
    });
    kpi2Add.addEventListener('click',()=>{
      kpi2Row.classList.remove('is-hidden'); kpi2Add.classList.remove('is-visible');
      if(!overlayMetric){
        const recovered=(preferredOverlay&&preferredOverlay!==primaryMetric&&metrics.includes(preferredOverlay))?preferredOverlay:(metrics.find(m=>m!==primaryMetric)||'');
        overlayMetric=recovered; overlayMetricSelect.value=recovered;
      }
      render();
    });
    render(); chartIndex++;
  }

  function showRac(container, data){
    if (!container) return;
    const metrics = numericKeys(data);
    const metric = metrics[0];
    let warning = "No numeric KPI metric found for RCA scoring.";
    if (metric) {
      const values = data.map(row => row[metric]).filter(v => typeof v === "number");
      const avg = aggregateValues(values, "avg");
      warning = `${metric} baseline average is ${avg.toFixed(2)} across ${data.length} filtered rows.`;
    }
    container.innerHTML = `
      <div class="rac-card rca-card rca-log-card">
        <h3>RCA Summary</h3>
        <p><b>Filtered Rows:</b> ${data.length}</p>
        <p><b>Assessment:</b> ${escapeHTML(warning)}</p>
        <p><b>Recommendation:</b> Review worst cells, vendor splits, and date buckets after each aggregation change.</p>
      </div>`;
  }

  function setFeedStatus(title, detail){
    const el=byId("autoFeedStatus"); if(!el)return;
    el.innerHTML=`<b>${escapeHTML(title)}</b><span>${escapeHTML(detail||"")}</span>`;
  }
  function activateParsedData(rows, sourceLabel){
    globalData=(rows||[]).filter(row=>Object.keys(row).length>0&&Object.values(row).some(v=>v!==null&&v!==""));
    if(!globalData.length)return false;
    populateGroupingDropdowns(globalData); buildDynamicFilters(globalData); updateBadges(globalData); runEnginePipeline();
    setFeedStatus("Automatic report feed", `${sourceLabel} · ${globalData.length.toLocaleString()} rows`);
    return true;
  }
  function loadCsvText(text, sourceLabel){
    return new Promise(resolve=>Papa.parse(text,{header:true,dynamicTyping:true,skipEmptyLines:true,complete:r=>resolve(activateParsedData(r.data,sourceLabel)),error:()=>resolve(false)}));
  }
  async function tryAutoReportFeed(){
    // Browser-safe OSS pattern: the nightly OSS/ETL job maintains reports/manifest.json or reports/latest.csv.
    // A web page cannot silently scan an arbitrary Windows folder, so the stable URL is intentional.
    if(/^https?:$/i.test(location.protocol)){
      try{
        const mr=await fetch("reports/manifest.json",{cache:"no-store"});
        if(mr.ok){
          const manifest=await mr.json();
          const latest=manifest.latest||manifest.file||manifest.path;
          if(latest){
            const rr=await fetch(String(latest),{cache:"no-store"});
            if(rr.ok && await loadCsvText(await rr.text(),`OSS ${latest}`))return;
          }
        }
      }catch(e){}
      try{
        const rr=await fetch("reports/latest.csv",{cache:"no-store"});
        if(rr.ok && await loadCsvText(await rr.text(),"OSS reports/latest.csv"))return;
      }catch(e){}
    }
    setFeedStatus("Automatic report feed","Embedded demo fallback · hosted OSS path: reports/latest.csv");
    await loadCsvText(EMBEDDED_CSV,"Embedded demo fallback");
  }
  window.addEventListener("message", evt => {
    const msg=evt.data;
    if(!msg||msg.type!=="geoai-scope"||!msg.scope||!globalData.length)return;
    const scope=msg.scope;
    const mapKey={Network:"Network",Region:"Region",City:"City",Vendor:"Vendor",Cluster:"Cluster",Site:"Site",Cell:"Cell"};
    const wanted={}; Object.keys(mapKey).forEach(k=>{if(scope[k])wanted[mapKey[k]]=String(scope[k])});
    buildDynamicFilters(globalData);
    Object.entries(wanted).forEach(([key,val])=>{const s=document.querySelector(`#filters select[data-key="${key}"]`);if(s&&[...s.options].some(o=>o.value===val))s.value=val});
    runEnginePipeline();
  });
  document.addEventListener("DOMContentLoaded",()=>{wireEvents();tryAutoReportFeed();});
  if (document.readyState !== "loading") { wireEvents(); tryAutoReportFeed(); }
})();
</script>
